name: 生成iptv
on:
  schedule:
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 北京时间 17:00 = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:  # 允许网页手动点击运行

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests eventlet

      - name: 执行扫描脚本
        run: python new.py

      - name: 上传产物 iptv.txt
        uses: actions/upload-artifact@v4
        with:
          name: iptv-file
          path: iptv.txt
          retention-days: 7
