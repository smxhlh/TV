name: IPTV自动更新
on:
  schedule:
    - cron: '0 22,10 * * *' # 北京时间6:00 / 18:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 安装Chromium浏览器
        run: |
          sudo apt update
          sudo apt install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromedriver /usr/local/bin/chromedriver

      - name: 设置Python环境（v6消除Node20弃用警告）
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装Python依赖（新增requests拉取代理池）
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: 运行IPTV采集脚本（自动代理轮询）
        run: python iptv_bc.py

      - name: 兜底提交推送
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "兜底自动更新 $(date +'%Y-%m-%d %H:%M:%S')" --allow-empty
          git push origin main
