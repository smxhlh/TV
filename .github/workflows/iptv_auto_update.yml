name: IPTV自动更新
on:
  schedule:
    - cron: '0 22,10 * * *' # 北京时间6点、18点
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 延长任务超时到20分钟
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装Chromium浏览器
        run: |
          sudo apt update
          sudo apt install -y chromium-browser chromium-chromedriver
          sudo ln -s /usr/bin/chromedriver /usr/local/bin/chromedriver

      - name: Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install selenium

      - name: 运行采集脚本
        run: python iptv_bc.py

      # 兜底推送（脚本内已推送，双重保险）
      - name: 兜底提交推送
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "兜底更新 $(date +'%Y-%m-%d %H:%M:%S')" --allow-empty
          git push origin main
