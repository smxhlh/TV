name: IPTV每日自动更新

# 触发规则：每日凌晨2点自动执行 + 支持手动点击触发
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# 运行环境
jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行IPTV解析生成脚本
        run: python update_iptv.py

      - name: 提交更新文件
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add 每日更新.txt
          git commit -m "自动更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin master
