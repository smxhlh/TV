name: IPTV自动更新

# 触发规则：每日凌晨2点自动执行 + 手动触发
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 强制清空冲突、检出最新代码
        uses: actions/checkout@v4
        with:
          ref: master
          clean: true
          fetch-depth: 1

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行IPTV解析生成脚本
        run: python update_iptv.py

      - name: 提交更新（解决工作流冲突）
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add 每日更新.txt
          git commit -m "自动更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" --allow-empty
          git push origin master --force-with-lease
