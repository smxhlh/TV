name: IPTV Auto Sort
run-name: IPTV自动分拣生成sou.txt

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build-sort:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装FFmpeg
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行分拣程序
        run: python main.py

      - name: Git配置
        run: |
          git config --global user.name "IPTV-Bot"
          git config --global user.email "bot@github.com"

      - name: 提交更新 sou.txt
        run: |
          git add sou.txt
          if git diff --cached --quiet; then
            echo "频道列表无更新，跳过提交"
          else
            git commit -m "🤖 自动更新sou.txt  $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
