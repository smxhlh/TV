name: 定时抓取瓜仔看影视片单
# 定时规则：每天凌晨2点自动爬取更新，可自行修改
on:
  schedule:
    - cron: '0 18 * * *'
  # 支持手动点击仓库按钮立刻执行抓取
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装Node.js运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装爬虫依赖
        run: npm install axios cheerio

      - name: 执行爬虫脚本，生成最新source.json
        run: node crawl.js

      - name: 提交更新后的json文件回仓库
        run: |
          git config --global user.name "Github爬虫机器人"
          git config --global user.email "robot@github.com"
          git add source.json
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新影片列表 $(date +'%Y-%m-%d %H:%M')"
          git push
