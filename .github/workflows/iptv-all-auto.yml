name: IPTV全流程自动更新
run-name: IPTV自动测速+分拣+采集全量更新
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'iptv_sort.py'
      - '.github/workflows/iptv-all-auto.yml'
      - 'main.py'
      - 'new.py'
      - 'requirements.txt'
  schedule:
    # 北京时间06:00 = UTC前一日22:00
    - cron: '0 22 * * *'
    # 北京时间18:00 = UTC 10:00
    - cron: '0 10 * * *'

name: IPTV自动更新
on: push
jobs:
  task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 配置Git身份
        run: |
          git config user.name "smxhlh"
          git config user.email "smxhlh@github.com"

      - name: 安装依赖
        run: pip install aiohttp requests eventlet

      - name: 运行扫描脚本
        run: python new.py

      - name: 提交更新文件
        run: |
          git add iptv.txt
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "自动更新IPTV源"
            git push
          fi

      - name: 执行IPTV测速脚本 iptv_sort.py
        run: python iptv_sort.py

      - name: 执行频道分拣脚本 main.py
        run: python main.py

      - name: 执行频道采集脚本 new.py
        run: python new.py

      - name: 检测文件变更并自动提交推送
        run: |
          git add iptv_all.txt sou.txt *.txt
          echo "===== 文件差异日志 ====="
          git diff --cached
          echo "========================"

          CHANNEL_CHANGE=$(git diff --cached | grep -v '^#' | wc -l)
          if [ "$CHANNEL_CHANGE" -eq 0 ]; then
            echo "所有频道文件无有效数据变更，跳过提交推送"
          else
            git commit -m "🤖 IPTV全流程自动更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
