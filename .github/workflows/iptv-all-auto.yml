name: IPTV全流程自动更新
run-name: IPTV测速+分拣全量更新
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'iptv_sort.py'
      - 'main.py'
      - '.github/workflows/iptv-full-auto.yml'
      - 'requirements.txt'
  schedule:
    # 北京时间06:00 = UTC前一日22:00
    - cron: '0 22 * * *'
    # 北京时间18:00 = UTC 10:00
    - cron: '0 10 * * *'

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 配置Git身份
        run: |
          git config user.name "smxhlh"
          git config user.email "smxhlh@github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖与Python依赖
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python -m pip install --upgrade pip
          pip install aiohttp requests eventlet

      # 执行测速脚本
      - name: 执行测速脚本 iptv_sort.py
        run: python iptv_sort.py

      # 执行频道分拣脚本
      - name: 执行频道分拣脚本 main.py
        run: python main.py

      # 先拉取远程最新代码，再处理变更提交，规避rebase报错
      - name: 拉取远程最新代码
        run: |
          git pull origin main --rebase

      - name: 检测变更并提交推送
        run: |
          git add *.txt
          echo "===== 文件差异日志 ====="
          git diff --cached
          echo "========================"
          CHANNEL_CHANGE=$(git diff --cached | grep -v '^#' | wc -l)
          if [ "$CHANNEL_CHANGE" -eq 0 ]; then
            echo "所有频道文件无有效数据变更，跳过提交推送"
          else
            git commit -m "🤖 IPTV全流程自动更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
