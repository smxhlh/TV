name: IPTV全流程合并自动更新
run-name: IPTV_all全更新
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'iptv_sort.py'
      - 'main.py'
      - 'auto_iptv.py'
      - '.github/workflows/iptv-full-auto.yml'
      - 'requirements.txt'
  schedule:
    # 北京时间06:00 = UTC前一日22:00
    - cron: '0 22 * * *'
    # 北京时间18:00 = UTC 10:00
    - cron: '0 10 * * *'

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      # 完整拉取仓库全部git历史，解决rebase冲突
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 配置Git身份
      - name: 配置Git身份
        run: |
          git config user.name "smxhlh"
          git config user.email "smxhlh@github.com"

      # 设置Python3.11环境
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 安装系统依赖ffmpeg + python全部依赖包
      - name: 安装系统依赖与Python依赖
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          python -m pip install --upgrade pip
          pip install aiohttp requests eventlet gitpython

      # 1、执行测速脚本 iptv_sort.py
      - name: 执行测速脚本 iptv_sort.py
        run: python iptv_sort.py

      # 2、执行频道分拣脚本 main.py
      - name: 执行频道分拣脚本 main.py
        run: python main.py

      # 3、执行auto_iptv.py脚本
      - name: 执行 auto_iptv.py
        run: python auto_iptv.py

      # 检测变更，先rebase拉远程再提交推送，解决fetch‑first报错
      - name: 检测变更并提交推送
        run: |
          git add *.txt
          echo "===== 文件差异日志 ====="
          git diff --cached
          echo "========================"
          CHANNEL_CHANGE=$(git diff --cached | grep -v '^#' | wc -l)
          if [ "$CHANNEL_CHANGE" -eq 0 ]; then
            echo "所有频道文件无有效数据变更，跳过提交推送"
          else
            git pull origin main --rebase
            git commit -m "🤖 IPTV合并全流程自动更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
