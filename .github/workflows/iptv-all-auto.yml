name: IPTV全流程自动更新
run-name: IPTV自动测速+分拣+采集全量更新
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# 统一触发规则
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'iptv_sort.py'
      - '.github/workflows/iptv-all-auto.yml'
      - 'main.py'
      - 'new.py'
      - 'requirements.txt'
  schedule:
    # 北京时间06:00 = UTC前一日22:00
    - cron: '0 22 * * *'
    # 北京时间18:00 = UTC 10:00
    - cron: '0 10 * * *'

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码
      - uses: actions/checkout@v4

      # 配置Git身份（你的账号smxhlh）
      - name: 配置Git身份
        run: |
          git config user.name "smxhlh"
          git config user.email "smxhlh@github.com"

      # 安装系统依赖ffmpeg + python库
      - name: 安装系统依赖与Python依赖
        run: |
          sudo apt update
          sudo apt install -y ffmpeg
          pip install aiohttp requests eventlet
          python -m pip install --upgrade pip
          pip install aiohttp requests eventlet gitpython
          
      # 1、采集源
      - name: 执行采集脚本 new.py
        run: python new.py

      # 2、测速脚本（依赖ffmpeg，现已预装）
      - name: 执行测速脚本 iptv_sort.py
        run: python iptv_sort.py

      # 3、频道整理分拣
      - name: 执行频道分拣脚本 main.py
        run: python main.py

      # 统一检测变更并提交推送
      - name: 检测变更并提交推送
        run: |
          git add *.txt
          echo "===== 文件差异日志 ====="
          git diff --cached
          echo "========================"
          CHANNEL_CHANGE=$(git diff --cached | grep -v '^#' | wc -l)
          if [ "$CHANNEL_CHANGE" -eq 0 ]; then
            echo "所有频道文件无有效数据变更，跳过提交推送"
          else
            git commit -m "🤖 IPTV全流程自动更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
