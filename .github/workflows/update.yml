name: IPTV Auto Update Daily 18:00

on:
  schedule:
    # UTC时间每日18点执行，北京时间+8小时=次日凌晨2点；想要北京时间18点则改为 cron: '0 10 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  update_iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 全局Git配置
        run: |
          git config --global core.quotepath false
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # 1. 拉取代码分支 main（存放脚本）
      - name: Checkout main branch (code)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. 拉取数据分支 master，读取旧daily.txt
      - name: Fetch master branch data file
        run: |
          git fetch origin master
          git checkout origin/master -- daily.txt
          ls -la daily.txt

      # 3. 安装Python依赖
      - name: Install Python dependencies
        run: |
          python3 -m pip install requests

      # 4. 运行更新脚本
      - name: Run auto update script
        run: python3 auto_update.py

      # 5. 切换到master分支提交新文件
      - name: Commit & Push to master branch
        run: |
          git checkout master
          git add daily.txt
          git status
          git commit -m "Auto update IPTV source $(date '+%Y-%m-%d %H:%M')"
          git push origin master
