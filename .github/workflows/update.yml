name: IPTV公开源
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
jobs:
  update_iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 全局Git配置
        run: |
          git config --global core.quotepath false
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global init.defaultBranch main

      - name: Checkout main branch (code)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch master branch data file
        run: |
          git fetch origin master:master
          git checkout master -- daily.txt || echo "无历史daily.txt，全新初始化"
          ls -la daily.txt

      - name: Install ffmpeg & Python dependencies
        run: |
          sudo apt update && sudo apt install -y ffmpeg
          python3 -m pip install --upgrade requests

      - name: Run auto update script
        run: python3 auto_update.py

      - name: Commit & Push to master branch
        run: |
          git checkout master
          if [ -f "daily.txt" ]; then
            git add daily.txt
            git status
            git commit -m "Auto update IPTV source $(date '+%Y-%m-%d %H:%M')"
            git push origin master
          else
            echo "未生成有效daily.txt，任务异常退出"
            exit 1
          fi
