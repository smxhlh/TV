name: IPTV每日自动更新

# 定时任务：每日8点自动执行（北京时间）
on:
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发更新
  workflow_dispatch:

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行采集测速脚本
        run: python auto_collect.py

      - name: 提交更新文件
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add 每日更新.txt
          git commit -m "自动更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin master
