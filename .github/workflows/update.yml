name: IPTV每日自动更新

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 设置最大运行45分钟，超时自动终止，避免无限转圈
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行采集测速脚本
        run: python auto_update.py

      - name: 提交更新文件
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add "每日更新.txt"
          # 没有变更时不报错退出
          git commit -m "自动更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" || echo "文件无改动，跳过提交"
          git push origin master
