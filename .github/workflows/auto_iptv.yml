name: IPTV源自动提取
run-name: ${{ github.actor }} 触发IPTV测速更新

# 触发规则：每日北京时间6点、18点定时 + 手动触发 + push代码触发
on:
  workflow_dispatch: # 页面手动运行按钮
  push:
    branches: [ main, master ]
    paths:
      - 'iptv_sort.py'
      - '.github/workflows/iptv-update.yml'
  schedule:
    # GitHub cron使用UTC时区，北京时间=UTC+8，需减8小时换算
    # 北京时间 06:00 → UTC前一日 22:00
    - cron: '0 22 * * *'
    # 北京时间 18:00 → UTC 10:00
    - cron: '0 10 * * *'

jobs:
  iptv-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整git历史，支持提交推送

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 缓存依赖包加速构建

      - name: 安装Python依赖
        run: |
          pip install requests

      - name: 执行IPTV测速脚本
        run: python iptv_sort.py

      - name: 配置Git提交机器人信息
        run: |
          git config --global user.name "IPTV-AutoBot"
          git config --global user.email "bot@github.com"

      - name: 安装Python依赖 + ffmpeg（本地运行才需要ffmpeg，CI实际不调用）
        run: |
          pip install requests
          sudo apt update && sudo apt install -y ffmpeg

       - name: 自动提交并推送更新后的iptv_all.txt
         run: |
           git add iptv_all.txt
           echo "===== 文件差异日志 ====="
           git diff --cached
           echo "========================"
           # 过滤注释行，仅判断真实频道数据变更
           CHANNEL_CHANGE=$(git diff --cached | grep -v '^#' | wc -l)
           if [ "$CHANNEL_CHANGE" -eq 0 ]; then
             echo "高清频道链接无变化，无需提交"
           else
             git commit -m "高清源自动更新 $(date '+%Y-%m-%d %H:%M')"
             git push
           fi
