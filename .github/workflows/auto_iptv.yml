name: IPTV M3U 单文件自动更新
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  crawl_and_sort:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run IPTV sort script 打印完整报错
        run: python -u iptv_sort.py

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Pull latest remote code
        run: git pull --rebase origin $(git rev-parse --abbrev-ref HEAD)

      - name: Stage changed file
        run: git add iptv_all.txt

      - name: Commit changes
        run: git commit -m "自动更新iptv_all.txt $(date '+%Y-%m-%d %H:%M')" --allow-empty

      - name: Push to remote repo
        run: git push origin $(git rev-parse --abbrev-ref HEAD)
