name: IPTV M3U 自动分类更新
# 触发方式：手动运行 + 每日凌晨3点定时
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  crawl_and_sort:
    runs-on: ubuntu-24.04
    steps:
      # 检出仓库代码
      - name: Checkout repo code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 配置Python环境
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 安装依赖requests
      - name: Install python dependency
        run: pip install requests

      # 执行抓取分类脚本
      - name: Run iptv sort script
        run: python iptv_sort.py

      # 配置Git提交身份
      - name: Config git user
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # 提交并推送更新后的txt文件
      - name: Commit & Push files
        run: |
          git add cctv.txt weishi.txt henan_local.txt movie.txt
          git status
          git commit -m "自动更新分类iptv源 $(date '+%Y-%m-%d %H:%M')" --allow-empty
          git push origin HEAD:master
