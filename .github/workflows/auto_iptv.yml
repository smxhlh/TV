name: IPTV Auto Update Live.txt
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  run_iptv_crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前脚本仓库代码
        uses: actions/checkout@v5

      - name: 安装系统依赖 Chrome & Chromedriver
        run: |
          sudo apt update
          sudo apt install -y chromium-chromedriver chromium-browser git

      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装Python依赖
        run: |
          pip install selenium requests

      - name: 执行IPTV采集脚本
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
          # 如需代理取消注释并在仓库添加PROXY_URL密钥
          # HTTP_PROXY: ${{ secrets.PROXY_URL }}
          # HTTPS_PROXY: ${{ secrets.PROXY_URL }}
        run: python iptv_bc.py

      - name: 上传运行日志
        uses: actions/upload-artifact@v5
        with:
          name: iptv-run-log
          path: IPTV_Log.txt
