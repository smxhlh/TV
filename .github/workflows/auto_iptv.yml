name: IPTV Auto Update Live.txt
# 触发规则：定时每天凌晨2点执行 + 手动点击运行
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  run_iptv_crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前脚本仓库代码
        uses: actions/checkout@v4

      - name: 安装系统依赖 Chrome & Chromedriver
        run: |
          sudo apt update
          sudo apt install -y chromium-chromedriver chromium-browser git

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装Python依赖
        run: |
          pip install selenium requests

      - name: 执行IPTV采集脚本
        env:
          # 关键：仓库PAT密钥，用于跨仓库推送smxhlh/TV
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: python iptv_bc.py

      - name: 上传运行日志
        uses: actions/upload-artifact@v4
        with:
          name: iptv-run-log
          path: IPTV_Log.txt
