name: Auto IPTV Update
on:
  schedule:
    # 北京时间 00:00 等于 UTC 16:00 (前一天)
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发调试

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须，允许action提交推送代码
    steps:
      - name: Checkout main branch (存放py脚本)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests eventlet gitpython

      - name: Run python script
        run: python auto_iptv.py
