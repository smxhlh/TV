name: IPTV M3U 自动分类更新
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  crawl_and_sort:
    runs-on: ubuntu-24.04
    steps:
      # 1. 完整拉取仓库所有分支历史，解决浅克隆推送128报错
      - name: Checkout repo code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 开启仓库写入权限
          persist-credentials: true

      # 2. Python 环境
      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. 安装依赖
      - name: Install python dependency
        run: pip install requests

      # 4. 运行抓取分类脚本
      - name: Run iptv sort script
        run: python iptv_sort.py

      # 5. 配置Git提交身份
      - name: Config git user
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # 6. 提交并推送（适配 main / master 双分支写法）
      - name: Commit & Push files
        run: |
          git add cctv.txt weishi.txt henan_local.txt movie.txt
          git status
          git commit -m "自动更新分类iptv源 $(date '+%Y-%m-%d %H:%M')" --allow-empty
          # 自动识别当前分支推送，不再硬编码 master
          git push origin HEAD
